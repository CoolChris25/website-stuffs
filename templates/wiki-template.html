<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} | Wiki</title>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('selected-theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <link rel="stylesheet" href="/website-stuffs/wiki-styles/main-styles.css">
    <script src="/website-stuffs/wiki-JS/main-code.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: url('{{bg}}') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
        }

        .wiki-layout, .content-area, main.content-area {
            background: transparent !important;
            border: none !important;
        }


        #sidebar {
            background-color: rgba(0, 0, 0, 0.2);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-inner {
            background: transparent;
        }
    </style>
</head>
<body>

    <div class="wiki-layout">
        <aside id="sidebar">
            <div class="sidebar-inner">
                <a href="./index.html" class="home-button">
                    <img src="{{icon}}" class="icon" style="max-width: 50px; display: flex;">
                </a>
                <a href="/website-stuffs/index.html" class="s-home-button">
                    <img src="/website-stuffs/assets/shared/general/info-icon.png" class="icon" style="max-width: 50px; display: flex;">
                </a>
                
                <div class="theme-menu">
                    <button class="menu-trigger" aria-haspopup="true" onclick="toggleThemeMenu(event)">Change Theme 🎨</button>
                    <div class="menu-content" id="themeMenuContent">
                        <button onclick="applyTheme('light')">Default Light</button>
                        <button onclick="applyTheme('dark')">Dark Mode</button>
                        <button onclick="applyTheme('kawaii')">🎀 Kawaii Mode</button>
                        <button onclick="applyTheme('blue')">Ocean Blue</button>
                        <button onclick="applyTheme('DARK MODE')">DARK MODE</button>
                    </div>
                </div>
            </div>
        </aside>

        <button id="sidebar-toggle" onclick="toggleSidebar()">&#9776;</button>

        <main class="content-area">
            {{PAGE_CONTENT}}
        </main>
    </div>
</body>
</html>
