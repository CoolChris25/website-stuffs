<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} | Wiki</title>


    <script>
        (function() {
            const savedTheme = localStorage.getItem('selected-theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>

    <link rel="stylesheet" href="../styles.css">
</head>
<body>

    <div class="wiki-layout">
            <div class="header-inline">
                <img src="../info%20icon.png" id="info-icon" alt="Logo">
            </div>

            <nav>
                <a href="../index.html">🏠 Home</a><br>
                <hr>
                <!-- THEME CHANGER DROPDOWN -->
                <div class="theme-menu">
                    <button class="menu-trigger">Change Theme 🎨</button>
                    <div class="menu-content">
                        <button onclick="applyTheme('light')">Default Light</button>
                        <button onclick="applyTheme('dark')">Dark Mode</button>
                        <button onclick="applyTheme('kawaii')">🎀 Kawaii Mode</button>
                        <button onclick="applyTheme('blue')">Ocean Blue</button>
                        <button onclick="applyTheme('DARK MODE')">DARK MODE</button>
                    </div>
                </div>
            </nav>
        </aside>

        <main class="content-area">
            {{PAGE_CONTENT}}
        </main>
    </div>

    <script src="../main-code.js"></script>
</body>
</html>
