<!DOCTYPE html>
<html lang="en">
<head>
     <script>
        const savedTheme = localStorage.getItem('selected-theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiki Thang</title>
    <link rel="stylesheet" href="styles.css">
    <script src="main code.js" defer></script>
</head>
<body class="MAIN">
    <!-- The Wrapper is the 'Boss Room' that holds everything -->
    <div class="wiki-layout">
        
        <!-- 1. The Main Content (Left Side) -->
        <main class="content-area">
            <h1>Wiki Thang</h1>
            
            <div class="header-inline">
                <h2>Welcome!</h2> 
                <img src="info icon.png" alt="information icon" id="info-icon" class="image">
            </div>

            <div class="search-wrapper">
                <input type="text" id="myInput" placeholder="Search the thangernet..." autocomplete="off">
                <ul id="results" class="results-list"></ul>
            </div>
        </main>

        <!-- 2. The Sidebar (Right Side) -->
        <aside id="sidebar">
            <div class="theme-menu">
  <button class="menu-trigger">Change Theme 🎨</button>
  <div class="menu-content">
    <button onclick="applyTheme('light')">Default Light</button>
    <button onclick="applyTheme('dark')">Dark Mode</button>
    <button onclick="applyTheme('kawaii')">🎀 Kawaii Mode</button>
    <button onclick="applyTheme('blue')">Ocean Blue</button>
  </div>
</div>

        </aside>

    </div> 
     <script src="main code.js"></script>
</body>
</html>
