<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiki Thang</title>
    
    <script>
        const savedTheme = localStorage.getItem('selected-theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
    
    <link rel="stylesheet" href="./wiki-styles/main-styles.css">
    <script src="./wiki-JS/main-code.js" defer></script>
    <script src="./wiki-JS/search-bars.js" defer></script>
</head>

<body class="MAIN">
    <div class="wiki-layout">
        
        <main class="content-area">
            <h1>Wiki Thang</h1>
            
            <div class="header-inline">
                <h2>Welcome!</h2> 
                <img src="/wiki/assets/shared/general/info-icon.png" alt="Information icon" id="info-icon">
            </div>

            <div class="search-wrapper">
                <input type="text" id="MainSearch" class="search-bar" data-source="./wiki-data/main-data.json" placeholder="Search the thangernet..." autocomplete="off">
                <ul class="results"></ul>
            </div>
        </main>

        <aside id="sidebar">
    <div class="sidebar-inner">
        <div class="theme-menu">
            <button class="menu-trigger" aria-haspopup="true" onclick="toggleThemeMenu(event)">Change Theme 🎨</button>
            <div class="menu-content" id="themeMenuContent">
                <button onclick="applyTheme('light')">Default Light</button>
                <button onclick="applyTheme('dark')">Dark Mode</button>
                <button onclick="applyTheme('kawaii')">🎀 Kawaii Mode</button>
                <button onclick="applyTheme('blue')">Ocean Blue</button>
                <button onclick="applyTheme('DARK MODE')">DARK MODE</button>
            </div>
        </div>
    </div>
</aside>
<button id="sidebar-toggle" onclick="toggleSidebar()">&#9776;</button>
    </div> 
</body>
</html>
